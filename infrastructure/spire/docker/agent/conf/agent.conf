agent {
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/tmp/spire-agent/public/api.sock"
    trust_domain = "ai-platform.local"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
            token_file = "/opt/spire/conf/agent/bootstrap.token"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "/var/run/docker.sock"
        }
    }

    SVIDStore "memory" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8082"
    live_path = "/live"
    ready_path = "/ready"
}
