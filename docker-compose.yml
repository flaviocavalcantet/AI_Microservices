# Production-grade local development stack for AI-Enabled Distributed Backend
# Services: api_service, auth_service, ai_worker, notification_service
# Infrastructure: MongoDB, RabbitMQ, Redis (optional)


services:
  mongodb:
    image: mongo:7.0
    container_name: ai_platform_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ai_platform
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - ai_network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "admin",
          "-p",
          "admin123",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai_platform_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: apppass123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_platform_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.auth_service
    container_name: ai_platform_auth_service
    working_dir: /app
    command: python -m src.main
    ports:
      - "5001:5000"
    environment:
      PYTHONPATH: /app
      FLASK_ENV: development
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/auth_service?authSource=admin
      RABBITMQ_URL: amqp://appuser:apppass123@rabbitmq:5672/
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/auth_service:/app
      - ./shared:/app/shared
    networks:
      - ai_network
    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api_service
    container_name: ai_platform_api_service
    working_dir: /app
    command: python -m services.api_service.src.main
    ports:
      - "5000:5000"
    environment:
      PYTHONPATH: /app
      FLASK_ENV: development
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/api_service?authSource=admin
      RABBITMQ_URL: amqp://appuser:apppass123@rabbitmq:5672/
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - ai_network
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai_worker
    container_name: ai_platform_ai_worker
    working_dir: /app
    command: python -m src.main
    ports:
      - "5002:5000"
    environment:
      PYTHONPATH: /app
      FLASK_ENV: development
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/ai_worker?authSource=admin
      RABBITMQ_URL: amqp://appuser:apppass123@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://appuser:apppass123@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ai_worker:/app
      - ./shared:/app/shared
    networks:
      - ai_network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.notification_service
    container_name: ai_platform_notification_service
    working_dir: /app
    command: python -m src.main
    ports:
      - "5003:5000"
    environment:
      PYTHONPATH: /app
      FLASK_ENV: development
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/notification_service?authSource=admin
      RABBITMQ_URL: amqp://appuser:apppass123@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://appuser:apppass123@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/notification_service:/app
      - ./shared:/app/shared
    networks:
      - ai_network
    restart: unless-stopped

  celery-worker-ai:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai_worker
    container_name: ai_platform_celery_worker_ai
    working_dir: /app
    command: >
      celery -A services.ai_worker.src.infrastructure.messaging.celery_app:celery
      worker -l info -c 4
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: amqp://appuser:apppass123@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - ai_network
    healthcheck:
      disable: true
    restart: unless-stopped

  celery-worker-notification:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.notification_service
    container_name: ai_platform_celery_worker_notification
    working_dir: /app
    command: >
      celery -A services.notification_service.src.infrastructure.messaging.celery_app:celery
      worker -l info -c 2
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: amqp://appuser:apppass123@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - ai_network
    healthcheck:
      disable: true
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: ai_platform_flower
    command: celery --broker=amqp://appuser:apppass123@rabbitmq:5672// flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped

networks:
  ai_network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data:
  redis_data:


# Usage:
# docker-compose up -d              # Start all services
# docker-compose down               # Stop all services
# docker-compose logs -f api_service # View api_service logs
# docker-compose ps                 # View service status
# 
# Service URLs:
# API Service: http://localhost:5000
# Auth Service: http://localhost:5001
# AI Worker: http://localhost:5002
# Notification Service: http://localhost:5003
# MongoDB: mongodb://admin:admin123@localhost:27017
# RabbitMQ Management: http://localhost:15672 (admin/admin)
# Redis: redis://localhost:6379
# Flower (Celery UI): http://localhost:5555
