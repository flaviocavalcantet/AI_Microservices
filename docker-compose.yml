version: '3.8'

# Production-grade local development stack for AI-Enabled Distributed Backend
# Services: api-service, auth-service, ai-worker, notification-service
# Infrastructure: MongoDB, RabbitMQ, Redis (optional)

services:
  # MongoDB: Primary datastore for all services
  mongodb:
    image: mongo:7.0
    container_name: ai_platform_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ai_platform
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - ai_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ: Message broker for event-driven communication
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai_platform_rabbitmq
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ai_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis: Caching layer and session store (optional)
  redis:
    image: redis:7-alpine
    container_name: ai_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Auth Service: Authentication and authorization
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.auth-service
    container_name: ai_platform_auth_service
    ports:
      - "5001:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: services.auth_service.main:create_app
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin123}@mongodb:27017/auth_service?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      SERVICE_NAME: auth-service
      SERVICE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai_network
    volumes:
      - ./services/auth-service:/app
    restart: unless-stopped

  # API Service: Main API gateway and orchestration
  api-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api-service
    container_name: ai_platform_api_service
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: services.api_service.main:create_app
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin123}@mongodb:27017/api_service?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      SERVICE_NAME: api-service
      SERVICE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_SERVICE_URL: http://auth-service:5000
      AI_WORKER_URL: http://ai-worker:5000
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - ai_network
    volumes:
      - ./services/api-service:/app
    restart: unless-stopped

  # AI Worker: Asynchronous AI/ML task processing
  ai-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai-worker
    container_name: ai_platform_ai_worker
    ports:
      - "5002:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: services.ai_worker.main:create_app
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin123}@mongodb:27017/ai_worker?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SERVICE_NAME: ai-worker
      SERVICE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_WORKERS: ${AI_WORKER_MAX_WORKERS:-4}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_network
    volumes:
      - ./services/ai-worker:/app
      - ai_worker_cache:/tmp/ai_worker_cache
    restart: unless-stopped

  # Notification Service: Asynchronous notification delivery
  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.notification-service
    container_name: ai_platform_notification_service
    ports:
      - "5003:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: services.notification_service.main:create_app
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin123}@mongodb:27017/notification_service?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SERVICE_NAME: notification-service
      SERVICE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_network
    volumes:
      - ./services/notification-service:/app
    restart: unless-stopped

  # Celery Worker: Processes async tasks for ai-worker
  celery-worker-ai:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai-worker
    container_name: ai_platform_celery_worker_ai
    command: celery -A services.ai_worker.infrastructure.messaging.celery_app worker -l info -c 4
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin123}@mongodb:27017/ai_worker?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - rabbitmq
      - redis
      - mongodb
    networks:
      - ai_network
    volumes:
      - ./services/ai-worker:/app
      - ai_worker_cache:/tmp/ai_worker_cache
    restart: unless-stopped

  # Celery Worker: Processes async tasks for notification-service
  celery-worker-notification:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.notification-service
    container_name: ai_platform_celery_worker_notification
    command: celery -A services.notification_service.infrastructure.messaging.celery_app worker -l info -c 2
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin123}@mongodb:27017/notification_service?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      - rabbitmq
      - redis
      - mongodb
    networks:
      - ai_network
    volumes:
      - ./services/notification-service:/app
    restart: unless-stopped

  # Celery Flower: Monitoring UI for Celery tasks
  flower:
    image: mher/flower:2.0
    container_name: ai_platform_flower
    command: celery --broker=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672// flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
    networks:
      - ai_network
    restart: unless-stopped

networks:
  ai_network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data:
  redis_data:
  ai_worker_cache:

# Usage:
# docker-compose up -d              # Start all services
# docker-compose down               # Stop all services
# docker-compose logs -f api-service # View api-service logs
# docker-compose ps                 # View service status
# 
# Service URLs:
# API Service: http://localhost:5000
# Auth Service: http://localhost:5001
# AI Worker: http://localhost:5002
# Notification Service: http://localhost:5003
# MongoDB: mongodb://admin:admin123@localhost:27017
# RabbitMQ Management: http://localhost:15672 (admin/admin)
# Redis: redis://localhost:6379
# Flower (Celery UI): http://localhost:5555
